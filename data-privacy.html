<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data-privacy</title>
</head>
<link rel="stylesheet" href="/src/style.css">
<script>
    const loadComponents = (id, url) => {
      fetch(url)
        .then((response) => response.text())
        .then((html) => {
          document.getElementById(id).innerHTML = html;
        });
    };
    window.onload = () => {
        Promise.all([
            loadComponents('header', 'src/sections/header.html'),
            loadComponents('data-privacy', 'src/sections/data-privacy-middle-section.html'),
            loadComponents('footer', 'src/sections/footer.html')]).then(() => {
                footerLocation()
            });
    }
</script>

<body>
    <div id="header"></div>
    <div id="data-privacy"></div>
    <div id="footer"></div>
</body>

</html>
