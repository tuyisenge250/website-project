<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data-privacy</title>
</head>
<link rel="stylesheet" href="/src/style.css">
<script>
    const loadComponents = (id, url) => {
        fetch(url)
            .then((response) => response.text())
            .then((html) => {
                document.getElementById(id).innerHTML = html;
            });
    };

    window.onload = () => {
        loadComponents('header', '/sections/header.html');
        loadComponents('footer', '/sections/footer.html');
        loadComponents('data-privacy', '/sections/data-privacy-middle-section.html');
    }
</script>

<body>
    <div id="header"></div>
    <div id="data-privacy"></div>
    <div id="footer"></div>
</body>

</html>
