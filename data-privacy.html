<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data-privacy</title>
</head>
<link rel="stylesheet" href="/src/style.css">
<script>
    const loadComponents = (id, url) => {
      fetch(url)
        .then((response) => response.text())
        .then((html) => {
          document.getElementById(id).innerHTML = html;
        });
    };
    window.onload = () => {
        Promise.all([
            loadComponents('header', '/sections/header.html'),
            loadComponents('data-privacy', '/sections/data-privacy-middle-section.html'),
            loadComponents('footer', '/sections/footer.html')]).then(() => {
                footerLocation()
            });
    }
</script>

<body class="bg-bgray">
    <div id="header" class="sticky top-0"></div>
    <div id="data-privacy"></div>
    <div id="footer" class="text-green-800"></div>
</body>
<script src="/header.js"></script>
<script src="footer.js"></script>
</html>
