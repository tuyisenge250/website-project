<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
    <title>Website project template</title>
    <script src="./src/footer.js"></script>
  </head>
  <script>
    const loadComponents = (id, url) => {
      fetch(url)
        .then((response) => response.text())
        .then((html) => {
          document.getElementById(id).innerHTML = html;
        });
    };
    window.onload = () => {
        Promise.all([
            loadComponents('header', '/sections/header.html'),
            loadComponents('hero', '/sections/hero.html'),
            loadComponents('contact', '/sections/contact.html'),
            loadComponents('about', '/sections/about.html'),
            loadComponents('service', '/sections/service.html'),
            loadComponents('reference', '/sections/reference.html'),
            loadComponents('footer', '/sections/footer.html')]).then(() => {
                footerLocation()
            });
    }
</script>
<body class="box-border font-outfit">
    <div id="header"></div>
    <div id="hero"></div>
    <div id="about"></div>
    <div id="service"></div>
    <div id="contact"></div>
    <div id="reference"></div>
    <div id="footer"></div>
</body>

</html>
