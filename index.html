<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
    <title>Website project template</title>
    
  </head>
  <script>
    const loadComponents = (id, url) =>  {
        fetch(url)
        .then((response) => response.text())
        .then((html) => {
            document.getElementById(id).innerHTML = html;
        });
    }

    window.onload = () => {
        loadComponents('header', '/sections/header.html'),
        loadComponents('hero', '/sections/hero.html'),
        loadComponents('about', '/sections/about.html'),
        loadComponents('service', '/sections/service.html')
        loadComponents('reference', '/sections/reference.html'),
        loadComponents('footer', '/sections/footer.html');
    }
</script>
<body class="box-border font-outfit">
   <div id="header" class="sticky top-0"></div>
   <div id="hero"></div>
   <div id="about"></div>
   <div id="service"></div>
   <div id="reference"></div>
   <div id="footer"></div>

     <script src="/reference.js"></script>
     <script src="/about.js"></script>
     <script src="/service.js"></script>
     <script src="/header.js"></script>
     <script src="footer.js"></script>
     <script src="/src/main.js"></script>
</body>
</html>
