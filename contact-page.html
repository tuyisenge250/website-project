<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="/src/style.css" rel="stylesheet">
</head>
<script>
    const loadComponents = (id, url) => {
      fetch(url)
        .then((response) => response.text())
        .then((html) => {
          document.getElementById(id).innerHTML = html;
        });
    };

    window.onload = () => {
        loadComponents('header', '/sections/header.html');
        loadComponents('footer', '/sections/footer.html');
        loadComponents('contact-middle', '/sections/contact-middle-section.html');
    }
</script>

<body>
    <div id="header"></div>
    <div id="contact-middle"></div>
    <div id="footer"></div>
</body>

</html>
