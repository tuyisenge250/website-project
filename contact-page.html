<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link href="/src/style.css" rel="stylesheet">
    <script src="/src/contact-page.js"></script>
</head>
<script>
    const loadComponents = (id, url) => {
      fetch(url)
        .then((response) => response.text())
        .then((html) => {
          document.getElementById(id).innerHTML = html;
        });
    };
    window.onload = () => {
        Promise.all([
            loadComponents('header', 'src/sections/header.html'),
            loadComponents('contact-middle', 'src/sections/contact-middle-section.html'),
            loadComponents('footer', 'src/sections/footer.html')]).then(() => {
                Contactpage()
            });
    }
</script>

<body>
    <div id="header"></div>
    <div id="contact-middle"></div>
    <div id="footer"></div>
</body>

</html>
